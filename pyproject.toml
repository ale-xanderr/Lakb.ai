[project]
name = "Lakb.ai"
version = "1.0.0"
description = "Your AI-powered travel companion"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
    "flet==0.28.3",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "flet-geolocator",
    "supabase"
]

[tool.flet.app]
path = "src"

[tool.flet.android]
# Adaptive icon configuration (optional but recommended)
# adaptive_icon_background = "#FFFFFF"  # Background color for adaptive icons
# adaptive_icon_foreground = "assets/icons/app_icon_foreground.png"  # Optional foreground layer

[tool.flet.android.permission]
# Location permissions (required for geolocation features)
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
# Network permissions (automatically granted, but explicit is better)
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet]
org = "com.lakbai"
product = "Lakb.ai"
company = "Group 10"
copyright = "Copyright (C) 2025 Lakb.ai"